model:
  image_size: 256

detection:
  image_score_method: max_raw
  image_threshold: 0.50
  pixel_threshold: 0.20

localization:
  gaussian_sigma: 1.0
  morphology_kernel: 3
  min_region_area: 30
  max_region_area: 3000
  max_region_width: 120
  max_region_height: 150
  min_region_width: 9
  min_region_height: 9
  border_margin: 5
  merge_distance: 0

patchcore:
  backbone: resnet18
  coreset_sampling_ratio: 0.10
  image_threshold: 2.30
  pixel_threshold: 0.70
  gaussian_sigma: 4.0
  model_dir: models/bottle/patchcore

patchcore_v22:
  backbone: resnet18
  layers: ['layer1', 'layer2', 'layer3']
  coreset_sampling_ratio: 0.10
  image_threshold: 2.20
  pixel_threshold: 0.60
  gaussian_sigma: 1.50
  model_dir: models/bottle/patchcore_v22

patchcore_v23:
  backbone: resnet18
  layers: ['layer1', 'layer2', 'layer3']
  coreset_sampling_ratio: 0.10
  image_threshold: 1.50
  pixel_threshold: 1.40
  gaussian_sigma: 1.20
  morphology_kernel: 3
  min_region_area: 25
  border_margin: 5
  merge_distance: 15.0
  model_dir: models/bottle/patchcore_v23

# Phase 3 Category-Aware Configuration
categories:
  bottle:
    model_dir: models/bottle/patchcore_v23
    use_spatial_prior: true
    image_threshold: 1.50
    pixel_threshold: 1.40
    gaussian_sigma: 1.20
    morphology_kernel: 3
    min_region_area: 25
    border_margin: 5
    merge_distance: 15.0

  leather:
    model_dir: models/leather/patchcore_v23
    use_spatial_prior: false
    image_threshold: 2.20
    pixel_threshold: 2.71
    gaussian_sigma: 1.20
    morphology_kernel: 3
    min_region_area: 25
    border_margin: 5
    merge_distance: 15.0

  transistor:
    model_dir: models/transistor/patchcore_v23
    use_spatial_prior: true
    image_threshold: 2.69
    pixel_threshold: 0.88
    gaussian_sigma: 1.20
    morphology_kernel: 3
    min_region_area: 25
    border_margin: 5
    merge_distance: 15.0

  zipper:
    model_dir: models/zipper/patchcore_v23
    use_spatial_prior: true
    image_threshold: 1.47
    pixel_threshold: 0.91
    gaussian_sigma: 1.20
    morphology_kernel: 3
    min_region_area: 25
    border_margin: 5
    merge_distance: 15.0

  screw:
    model_dir: models/screw/patchcore_v23
    use_spatial_prior: true
    image_threshold: 2.28
    pixel_threshold: 2.00
    gaussian_sigma: 1.20
    morphology_kernel: 3
    min_region_area: 25
    border_margin: 5
    merge_distance: 15.0
